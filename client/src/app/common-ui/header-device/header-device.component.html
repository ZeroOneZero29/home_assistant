@if (himidity) {
<div class="header__container">
  <div class="climate-container">
    <svg class="icon__header_climate" icon="thermometer"></svg>
    <div class="text-container">
      <p class="himidity">{{ himidity }}%</p>
      <p class="temperature">{{ temperature }}<sup>o</sup>C</p>
    </div>
  </div>

  <div class="date-container">
    <svg class="icon__header" icon="calendar"></svg>
    <div class="text-container-date">
      <p class="date">
        {{ now | date : 'd MMM' }}
      </p>
      <p class="time">{{ now | date : 'HH' }}:{{ now | date : 'mm' }}</p>
    </div>
  </div>

  <div class="button-container">
    <p class="ligth">Общий свет</p>

    <label class="switch">
      <input type="checkbox" checked (click)="Click()" />
      <span class="slider round"></span>
    </label>
  </div>
</div>

}
